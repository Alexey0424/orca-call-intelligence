name: orca-ser-stack

# ─────────────────────────────────────────────────────────────────────────────
#  docker-compose.yml  —  ORCA: self-hosted sales-call Speech Emotion
#  Recognition + RAG stack
#
#  Services:
#    postgres (pgvector)   — calls / utterances / events + vector indexes
#    ollama                — local LLM + embedding inference
#    call-analysis-api     — GPU pipeline: ASR → diarization → emotion → KPIs
#    rag-api               — CPU read path: semantic search / dashboard / reports
#    render-api            — HTML + PDF report renderer (WeasyPrint, pure SVG)
#    gotenberg             — headless Chromium for dashboard PNG screenshots
#    n8n (+ n8n-import)    — orchestration + RAG chat agent demo
#    orca-ui-ser-control   — pipeline control center (model hot-swap, run history)
#    adminer               — one-click Postgres browser
#
#  Start (NVIDIA GPU profile — recommended):
#    docker compose --profile gpu-nvidia up -d
#
#  Start (CPU only — Ollama on CPU; the audio pipeline falls back to CPU too,
#  expect much slower calls):
#    docker compose --profile cpu up -d
#
#  Rebuild a service after code changes:
#    docker compose --profile gpu-nvidia up -d --build call-analysis-api
# ─────────────────────────────────────────────────────────────────────────────

volumes:
  n8n_storage:
  postgres_storage:
  ollama_storage:
  hf_cache:
  torch_cache:
  modelscope_cache:        # emotion2vec+ via FunASR downloads to /root/.cache/modelscope

networks:
  demo:

x-n8n: &service-n8n
  image: n8nio/n8n:latest
  networks: ['demo']
  env_file:
    - .env
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    # n8n owns the `n8n` Postgres database exclusively. App data is in `orca`.
    - DB_POSTGRESDB_DATABASE=n8n
    - DB_POSTGRESDB_USER=${POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET}
    - OLLAMA_HOST=${OLLAMA_HOST}
    - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    - N8N_FILESYSTEM_ALLOWED_PATHS=/data

x-ollama: &service-ollama
  image: ollama/ollama:latest
  networks:
    demo:
      # Every other service reaches Ollama as `ollama:11434` regardless of
      # which profile variant (gpu/cpu/amd) is running.
      aliases: [ollama]
  restart: unless-stopped
  environment:
    # Unload idle models after 5 min so the GPU idles lean. The first
    # KPI/chat after >5 min idle pays a cold reload (~15-25 s) — cheap
    # next to pinning ~12 GB of weights forever on a 16 GB card.
    - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
  ports:
    # Loopback only — Ollama has no auth and would otherwise be an open
    # LLM endpoint on the LAN.
    - "127.0.0.1:11434:11434"
  volumes:
    - ollama_storage:/root/.ollama

x-init-ollama: &init-ollama
  image: ollama/ollama:latest
  networks: ['demo']
  volumes:
    - ollama_storage:/root/.ollama
  entrypoint: /bin/sh
  environment:
    - OLLAMA_HOST=${OLLAMA_HOST}
    # KPI extraction + coaching rubric + the n8n chat agent. ~9.6 GB —
    # fits a 16 GB card alongside the audio pipeline.
    - LLM_MODEL_ID=${LLM_MODEL_ID:-gemma4:e4b}
    # Speaker→role opening relabel (research winner for that task; the KPI
    # model is the in-code fallback). Set OPENING_RELABEL_MODEL to the same
    # value as LLM_MODEL_ID in .env to skip this ~9 GB pull.
    - OPENING_RELABEL_MODEL=${OPENING_RELABEL_MODEL:-qwen2.5:14b-instruct-q4_K_M}
    # Embeddings: Qwen3-Embedding-4B trained with Matryoshka. The services
    # take the leading 1024 dims and re-normalise client-side (native 2560).
    - EMBEDDING_MODEL_ID=${EMBEDDING_MODEL_ID:-qwen3-embedding:4b}
  command:
    - "-c"
    - |
      sleep 5
      ollama pull "$${EMBEDDING_MODEL_ID}"
      ollama pull "$${LLM_MODEL_ID}"
      ollama pull "$${OPENING_RELABEL_MODEL}"

services:
  postgres:
    # pgvector is required by the `calls.summary_embedding` and
    # `utterances.text_embedding` halfvec columns. Otherwise drop-in
    # compatible with vanilla postgres:16.
    image: pgvector/pgvector:pg16
    hostname: postgres
    networks: ['demo']
    restart: unless-stopped
    # No host port mapping on purpose: Postgres is reachable from sibling
    # containers via the `demo` docker network; Adminer (loopback) is the
    # browser entrypoint; ad-hoc psql goes through `docker compose exec`.
    expose:
      - "5432"
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres_storage:/var/lib/postgresql/data
      # `orca` DB auto-created on first boot of a fresh postgres_storage
      # volume. The n8n DB is created by the postgres image itself from
      # POSTGRES_DB.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Gotenberg: headless-Chromium HTTP service for URL→PNG screenshots ───
  # Used by rag-api to screenshot the render-api dashboard HTML into a PNG.
  # Internal-only — not exposed to the host.
  gotenberg:
    image: gotenberg/gotenberg:8
    hostname: gotenberg
    networks: ['demo']
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--api-timeout=60s"
      - "--chromium-max-queue-size=10"

  # ── Adminer: lightweight web UI for Postgres at http://localhost:8081 ───
  adminer:
    image: adminer:latest
    hostname: adminer
    networks: ['demo']
    restart: unless-stopped
    ports:
      # Loopback only — never expose a one-click DB admin to the LAN.
      - "127.0.0.1:8081:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
      - ADMINER_DESIGN=hever
    depends_on:
      postgres:
        condition: service_healthy

  call-analysis-api:
    build:
      context: .
      dockerfile: call-analysis-api/Dockerfile
      args:
        HF_TOKEN: ${HF_TOKEN}
    container_name: call-analysis-api
    hostname: call-analysis-api
    networks: ['demo']
    restart: unless-stopped
    # The API holds GPU state and a Postgres connection pool; the default
    # 10s SIGTERM grace window isn't enough and Docker would SIGKILL it.
    stop_grace_period: 60s
    # start_period must cover the worst-case COLD start: after a full host
    # reboot the model loads read from cold disk and the ASR warm-up pays
    # Whisper's first-inference CUDA/cuDNN init (minutes, not seconds).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); sys.exit(0 if r.status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 900s
    ports:
      # Loopback only — /scorecard has no auth and would otherwise accept
      # anonymous LAN uploads.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - hf_cache:/root/.cache/huggingface
      - torch_cache:/root/.cache/torch
      # FunASR / ModelScope cache for emotion2vec+ — without this, every
      # container recreate re-downloads ~2 GB of weights from modelscope.cn.
      - modelscope_cache:/root/.cache/modelscope
      - ./data:/data
      # Shared with orca-ui-ser-control — the control UI writes
      # ./runtime/overrides.json and the API reads it (per-request for
      # Ollama models, at reload for audio models).
      - ./runtime:/data/runtime
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Cap host RAM so an out-of-memory kill is visible as a clean cgroup
    # OOMKilled=true on `docker inspect` instead of a silent host SIGKILL.
    mem_limit: 10g
    memswap_limit: 14g
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # ── Model lifecycle ──────────────────────────────────────────────────
      # 0 (serialized, default): audio models lazy-load per call + evict
      #   after, so the GPU is free when idle (~15-30 s reload/call).
      # 1: keep all models resident for fast back-to-back calls (~14 GB idle).
      - PRELOAD_MODELS=${PRELOAD_MODELS:-0}
      # ── ASR — Whisper via faster-whisper (CTranslate2), English-only ──────
      - WHISPER_MODEL_ID=${WHISPER_MODEL_ID:-base}
      - WHISPER_COMPUTE=${WHISPER_COMPUTE:-float16}
      # ── HF auth (gated pyannote models) ───────────────────────────────────
      - HF_TOKEN=${HF_TOKEN}
      # ── Diarization (pyannote) ────────────────────────────────────────────
      - DIARIZATION_MODEL_ID=${DIARIZATION_MODEL_ID:-pyannote/speaker-diarization-3.1}
      # ── Text sentiment (RoBERTa, 3-class) ─────────────────────────────────
      - SENTIMENT_MODEL_ID=${SENTIMENT_MODEL_ID:-cardiffnlp/twitter-roberta-base-sentiment-latest}
      - SENTIMENT_BATCH_SIZE=${SENTIMENT_BATCH_SIZE:-32}
      # ── Speech emotion (emotion2vec+ large, 9-class) ──────────────────────
      - SER_MODEL_ID=${SER_MODEL_ID:-iic/emotion2vec_plus_large}
      - SER_BATCH_SIZE=${SER_BATCH_SIZE:-8}
      - SER_SEGMENT_CAP=${SER_SEGMENT_CAP:-30}
      - MAX_PROSODY_SECONDS=${MAX_PROSODY_SECONDS:-300}
      # ── Entity extraction (GLiNER, zero-shot) ─────────────────────────────
      - NER_MODEL_ID=${NER_MODEL_ID:-urchade/gliner_multi-v2.1}
      - NER_THRESHOLD=${NER_THRESHOLD:-0.45}
      # ── LLM (Ollama) — KPI extraction + coaching rubric ───────────────────
      - OLLAMA_HOST=http://${OLLAMA_HOST}
      - LLM_MODEL_ID=${LLM_MODEL_ID:-gemma4:e4b}
      - LLM_TIMEOUT_SEC=${LLM_TIMEOUT_SEC:-600}
      - LLM_NUM_CTX=${LLM_NUM_CTX:-16384}
      - LLM_NUM_PREDICT=${LLM_NUM_PREDICT:-4096}
      # ── LLM opening speaker→role relabel (pipeline/opening_relabel.py) ────
      # Fixes diarization's cold-start role mislabel by reading the opening
      # transcript. keep_alive:0 — holds no VRAM between calls.
      - OPENING_RELABEL_ENABLED=${OPENING_RELABEL_ENABLED:-1}
      - OPENING_RELABEL_MODEL=${OPENING_RELABEL_MODEL:-qwen2.5:14b-instruct-q4_K_M}
      - OPENING_RELABEL_WINDOW_SEC=${OPENING_RELABEL_WINDOW_SEC:-60}
      # ── Embeddings (Ollama + Matryoshka MRL 2560 → 1024 truncation) ───────
      - EMBEDDING_MODEL_ID=${EMBEDDING_MODEL_ID:-qwen3-embedding:4b}
      - EMBEDDING_NATIVE_DIM=${EMBEDDING_NATIVE_DIM:-2560}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      # -1 = auto-fit (GPU when there's room; CPU fallback). 0 = force CPU.
      - EMBEDDING_NUM_GPU=${EMBEDDING_NUM_GPU:--1}
      # ── Reconciliation (Whisper words ↔ diarization turns) ────────────────
      # Defaults = bone-stock max-overlap reconciliation; the LLM opening
      # relabel handles role attribution. Escape hatches kept for A/B work.
      - MIN_INTRA_TURN_RUN_WORDS=${MIN_INTRA_TURN_RUN_WORDS:-1}
      - WORD_SILENCE_SPLIT_ENABLED=${WORD_SILENCE_SPLIT_ENABLED:-0}
      # ── Chat priority gate — OFF (no live-chat service in this stack) ─────
      - CHAT_PRIORITY_ENABLED=${CHAT_PRIORITY_ENABLED:-0}
      # ── Gotenberg (screenshot service) ────────────────────────────────────
      - GOTENBERG_URL=${GOTENBERG_URL:-http://gotenberg:3000}
      # ── Postgres (schema auto-created in the `orca` DB at startup) ────────
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/orca

  # ── rag-api: CPU read/serve path (search + dashboard + on-demand report) ──
  # Owns /search (cosine search via pgvector), /dashboard(.png) (view-model
  # SQL → render-api → Gotenberg screenshot), and /report/{call_id}
  # (render-once-then-cache). Reads Postgres + Ollama embeddings only —
  # no GPU, no torch.
  rag-api:
    build:
      context: .
      dockerfile: rag-api/Dockerfile
    hostname: rag-api
    networks: ['demo']
    restart: unless-stopped
    ports:
      # Loopback only. Host port 8002 keeps call-analysis-api on 8000.
      - "127.0.0.1:8002:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/orca
      - OLLAMA_HOST=http://${OLLAMA_HOST}
      - EMBEDDING_MODEL_ID=${EMBEDDING_MODEL_ID:-qwen3-embedding:4b}
      - EMBEDDING_NATIVE_DIM=${EMBEDDING_NATIVE_DIM:-2560}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      - EMBEDDING_NUM_GPU=${EMBEDDING_NUM_GPU:--1}
      - SER_RENDER_URL=http://render-api:8010
      - GOTENBERG_URL=${GOTENBERG_URL:-http://gotenberg:3000}
      - RAG_API_PUBLIC_URL=${RAG_API_PUBLIC_URL:-http://localhost:8002}
      - RUNTIME_OVERRIDES_PATH=/data/runtime/overrides.json
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Dashboard branding — change in .env, no code edits needed.
      - BRAND_MARK=${BRAND_MARK:-O}
      - BRAND_NAME=${BRAND_NAME:-ORCA}
      - BRAND_SUB=${BRAND_SUB:-Call Intelligence}
      - BRAND_FOOTER_LEFT=${BRAND_FOOTER_LEFT:-ORCA · Call Intelligence Report}
      - BRAND_FOOTER_RIGHT=${BRAND_FOOTER_RIGHT:-Powered by ORCA}
    volumes:
      - ./data:/data
      - ./runtime:/data/runtime:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); sys.exit(0 if r.status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  # ── orca-ui-ser-control: local control center for the SER pipeline ──────
  # Pure-Python FastAPI + Jinja2 + HTMX. Observes call-analysis-api over
  # HTTP and Postgres directly, writes runtime model overrides to a shared
  # file (./runtime/overrides.json), and can restart call-analysis-api via
  # the Docker socket. Loopback-only.
  orca-ui-ser-control:
    build:
      context: ./ORCA_UI_SER_CONTROL
      dockerfile: Dockerfile.dockerfile
    hostname: orca-ui-ser-control
    networks: ['demo']
    restart: unless-stopped
    ports:
      - "127.0.0.1:8040:8040"
    environment:
      - SER_API_URL=${SER_API_URL:-http://call-analysis-api:8000}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/orca
      - SER_API_PUBLIC_URL=${SER_API_PUBLIC_URL:-http://localhost:8000}
      - SER_RENDER_PUBLIC_URL=${SER_RENDER_PUBLIC_URL:-http://localhost:8010}
      - RUNTIME_OVERRIDES_PATH=/data/runtime/overrides.json
      - SER_API_CONTAINER=call-analysis-api
      # n8n webhook URL the "Run pipeline" button hits (the bundled workflow
      # is manual-trigger; leave unset and the button shows disabled).
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Read-only access to the Docker Engine API so the UI can read
      # container state and restart call-analysis-api after a model swap.
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared override file with call-analysis-api.
      - ./runtime:/data/runtime
      # Curated browse SQL surfaced as presets in the Database page.
      - ./shared:/data/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8040/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  render-api:
    build:
      context: ./render-api
      dockerfile: Dockerfile
    hostname: render-api
    networks: ['demo']
    restart: unless-stopped
    ports:
      # Loopback only — internal service that rag-api calls.
      - "127.0.0.1:8010:8010"
    volumes:
      - ./data:/data
    environment:
      - OUTPUT_DIR=${SER_RENDER_OUTPUT_DIR:-/data/reports}
      - PUBLIC_BASE_URL=${SER_RENDER_PUBLIC_BASE_URL:-http://localhost:8010}
      - REPORT_COMPANY_NAME=${REPORT_COMPANY_NAME:-ORCA Executive Call Review}
      - REPORT_BRAND_COLOR=${REPORT_BRAND_COLOR:-#1a3c34}
      - REPORT_ACCENT_COLOR=${REPORT_ACCENT_COLOR:-#c9a84c}

  n8n-import:
    <<: *service-n8n
    hostname: n8n-import
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        # `list:workflow` prints advisory lines on fresh installs, so test
        # for actual id|name rows instead of any output at all.
        if ! n8n list:workflow 2>/dev/null | grep -qE '^[A-Za-z0-9]{10,}\|'; then
          n8n import:credentials --separate --input=/demo-data/credentials && \
          n8n import:workflow    --separate --input=/demo-data/workflows
        else
          echo "Workflows already exist — skipping import."
        fi
    volumes:
      - ./n8n/demo-data:/demo-data
    depends_on:
      postgres:
        condition: service_healthy
    networks: ['demo']

  n8n:
    <<: *service-n8n
    hostname: n8n
    restart: unless-stopped
    ports:
      # Loopback only — the editor is browser-on-host.
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n/demo-data:/demo-data
      - ./shared:/data/shared
      - ./data:/data
      - ./audio:/home/node/.n8n-files/audio
    depends_on:
      postgres:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully
    networks: ['demo']

  ollama-cpu:
    profiles: ["cpu"]
    <<: *service-ollama

  ollama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *service-ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-gpu-amd:
    profiles: ["gpu-amd"]
    <<: *service-ollama
    image: ollama/ollama:rocm
    devices:
      - "/dev/kfd"
      - "/dev/dri"

  ollama-pull-models-cpu:
    profiles: ["cpu"]
    <<: *init-ollama
    depends_on:
      - ollama-cpu

  ollama-pull-models-gpu:
    profiles: ["gpu-nvidia"]
    <<: *init-ollama
    depends_on:
      - ollama-gpu

  ollama-pull-models-gpu-amd:
    profiles: ["gpu-amd"]
    <<: *init-ollama
    image: ollama/ollama:rocm
    depends_on:
      - ollama-gpu-amd
